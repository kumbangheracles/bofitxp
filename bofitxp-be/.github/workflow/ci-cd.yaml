name: BOFITXP Backend CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # -------------------------------------------------------------
  # JOB 1: TESTING & BUILD (CI)
  # -------------------------------------------------------------
  test-and-build:
    runs-on: ubuntu-latest

    services:
      # Isolated MongoDB Service Container khusus jalankan unit test Jest
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Tests (Jest)
        env:
          # URI lokal ini hanya dipake sementara oleh runner GitHub Actions
          DATABASE_URL: "mongodb://localhost:27017/bofitxp_ci_test?directConnection=true"
          PORT: 3000
        run: npm test

      - name: Build TypeScript Project
        run: npm run build

  # -------------------------------------------------------------
  # JOB 2: DEPLOYMENT (CD)
  # -------------------------------------------------------------
  deploy:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
