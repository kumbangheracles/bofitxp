name: BOFITXP Backend CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bofitxp-be

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      DATABASE_URL: mongodb://localhost:27017/bofitxp_ci_test?directConnection=true
      SECRET: ci-secret
      PORT: 3000
      OTP_RATE_LIMIT_SECRET: ci-otp-secret
      GROQ_API_KEY: test-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: bofitxp-be/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Jest tests
        run: npx jest --config ./jest.config.ts --runInBand

      - name: Build TypeScript project
        run: npm run build

  deploy:
    name: Backend CD
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy backend to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-version: "47.2.2"
          vercel-args: "--prod"
          working-directory: ./bofitxp-be
          root-directory: ./bofitxp-be
